name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        backend: [rust]
        include:
          - python-version: "3.12"
            backend: portable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build sdist and wheel
        run: |
          if [[ "${{ matrix.backend }}" == "portable" ]]; then
            mkdir "$RUNNER_TEMP/no-rust"
            ln -s /bin/false "$RUNNER_TEMP/no-rust/rustc"
            export PATH="$RUNNER_TEMP/no-rust:$PATH"
          fi
          python -m pip install build
          python -m build
      - name: Install wheel and verify backend
        run: |
          wheels=(dist/*.whl)
          python -m pip install "${wheels[0]}[benchmark]"
          python -c "from symbolic_primes._accelerator import native; assert (native is not None) == ('${{ matrix.backend }}' == 'rust')"
      - name: Test Rust kernels
        if: matrix.backend == 'rust' && matrix.python-version == '3.12'
        run: cargo test --locked --manifest-path native/Cargo.toml
      - name: Run verification suites
        run: python -m unittest discover -s tests -v
      - name: Run symbolic benchmark smoke test
        run: python -m symbolic_primes.benchmark --skip-primes --repeats 3 --growth-levels 4
