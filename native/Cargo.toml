[package]
name = "symbolic-primes-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23.5", features = ["abi3-py311"] }
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"

[profile.release]
lto = "thin"
