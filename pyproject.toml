[build-system]
requires = ["setuptools>=64", "setuptools-rust>=1.9"]
build-backend = "setuptools.build_meta"

[project]
name = "symbolic-primes"
version = "0.1.0"
description = "Exact arithmetic on compressed signed base-2 power circuits"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
acceleration = ["numpy>=1.26"]
benchmark = ["numpy>=1.26", "sympy>=1.13"]

[project.scripts]
symbolic-primes-benchmark = "symbolic_primes.benchmark:main"
symbolic-primes-deep-benchmark = "symbolic_primes.deep_benchmark:main"
symbolic-primes-quotient-benchmark = "symbolic_primes.quotient_benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.setuptools-rust.ext-modules]]
target = "symbolic_primes._native"
path = "native/Cargo.toml"
binding = "PyO3"
optional = true
debug = false
