name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install arithmetic libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libflint-dev libgmp-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - run: python3 tools/verify_scale.py --size-mib 1
      - name: Check archive integrity
        run: |
          snapshot=$(mktemp -d)
          tar -xJf archive/before-packed-binary.tar.xz -C "$snapshot"
          (cd "$snapshot" && sha256sum --check --status SNAPSHOT.sha256)
