name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install ".[benchmark]"
      - name: Run verification suites
        run: python -m unittest discover -s tests -v
      - name: Run symbolic benchmark smoke test
        run: python -m symbolic_primes.benchmark --skip-primes --repeats 3 --growth-levels 4
